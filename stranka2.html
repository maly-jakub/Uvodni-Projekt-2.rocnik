<!DOCTYPE html>
<html lang="cs">

<head>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>

    <style>
        .carousel {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            max-width: 1000px;
            margin: auto;
        }

        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }

        .carousel-caption {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 10px;
            border-radius: 5px;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Domů</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" href="stranka2.html">Carousel</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka3.html">Karty</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka4.html">Formulář</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka5.html">Progress</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka6.html">Dokumentace</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h1>Carousel</h1>

        <div id="demo" class="carousel slide my-4" data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="3"></button>
            </div>

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="images/stockholm.webp" class="d-block w-100" alt="Stockholm">
                    <div class="carousel-caption">
                        <h2>Stockholm, Švédsko</h2>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/praha.webp" class="d-block w-100" alt="Praha">
                    <div class="carousel-caption">
                        <h2>Praha, Česko</h2>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/newyork.jpg" class="d-block w-100" alt="New York">
                    <div class="carousel-caption">
                        <h2>New York, USA</h2>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/nairobi.jpg" class="d-block w-100" alt="Nairobi">
                    <div class="carousel-caption">
                        <h2>Nairobi, Keňa</h2>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <footer class="bg-light text-center py-3">
        <a href="Dokumentace.pdf" target="_blank">Dokumentace projektu</a>
    </footer>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
