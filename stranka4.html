<!DOCTYPE html>
<html lang="cs">

<head>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.bootstrap5.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulář</title>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Domů</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="stranka2.html">Carousel</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka3.html">Karty</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="stranka4.html">Formulář</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka5.html">Progress</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="stranka6.html">Dokumentace</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h1>Kontaktní formulář</h1>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="zprava" class="form-label">Zpráva</label>
                <textarea class="form-control" name="zprava" id="zprava" rows="5" required></textarea>
            </div>

            <div class="mb-3">
                <label for="technologie" class="form-label">Použité
                    technologie</label>

                <select id="technologie" name="technologie[]" multiple required>
                    <option value="" disabled selected>vyberte...</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="bootstrap">Bootstrap</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Odeslat
            </button>
        </form>

    </div>

    <footer class="bg-light text-center py-3">
        <a href="Dokumentace.pdf" target="_blank">Dokumentace projektu</a>
    </footer>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script src="node_modules/tom-select/dist/js/tom-select.complete.min.js"></script>

    <script>
        new TomSelect("#technologie", {
            placeholder: "Vyberte..."
        });
    </script>
</body>

</html>
